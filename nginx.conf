server {

    listen 8000 default_server;

    autoindex on;
    tcp_nodelay on;
    server_tokens off;
    absolute_redirect off;

    error_log /dev/null;
    access_log /dev/null;

    auth_basic off;
    auth_basic_user_file /etc/nginx/.htpasswd;

    include /etc/nginx/mime.types;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 500;
    gzip_disable "msie6";
    gzip_types text/css text/javascript text/xml text/plain text/x-component application/javascript application/json application/xml application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    add_header Cache-Control "no-cache";

    location / {

      root /run/shm;

      if ( -f /run/shm/index.html) {
        break;
      }

      try_files /index.html @vnc;
    }
    
    location /ps {
      proxy_pass http://127.0.0.1:8090/ps;
    }
    
    location /startVM {
      proxy_pass http://127.0.0.1:8090/startVM;
    }
    
    location /killVM {
      proxy_pass http://127.0.0.1:8090/killVM;
    }    
    
    location /revertVM {
      proxy_pass http://127.0.0.1:8090/revertVM;
    }    
    
    location /logon {
      proxy_pass http://127.0.0.1:8090/logon;
    }    
    
    location /addUSB {
      proxy_pass http://127.0.0.1:8090/addUSB;
    }
    location @vnc {

      root /usr/share/novnc;
      index vnc.html;

    }

    location /status {

      proxy_http_version 1.1;

      proxy_set_header Connection 'upgrade';
      proxy_set_header Upgrade $http_upgrade;

      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;

      proxy_pass http://127.0.0.1:8004/;
    }

    location /websockify {

      proxy_http_version 1.1;

      proxy_set_header Connection 'upgrade';
      proxy_set_header Upgrade $http_upgrade;

      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;

      proxy_pass http://127.0.0.1:5700/;
    }

}
